version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: integration_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: integration_engine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d integration_engine"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
